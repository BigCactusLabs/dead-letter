[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dead-letter"
version = "0.2.4"
description = "Convert .eml email exports to Markdown with YAML front matter"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
authors = [{ name = "Big Cactus Labs" }]
keywords = ["eml", "email", "markdown", "converter", "archive"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "icalendar>=6.1.1",
  "mail-parser>=4.2.0",
  "mail-parser-reply>=1.35",
  "nh3>=0.2.20",
  "html-to-markdown>=3.1.0,<4.0",
  "selectolax>=0.3.28",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
cli = ["watchfiles>=1.0.0"]
mcp = ["mcp>=2,<3"]
ui = [
  "dead-letter[cli]",
  "fastapi>=0.136.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.26",
  "uvicorn[standard]>=0.45.0",
]
benchmark = ["tiktoken>=0.8.0"]
dev = [
  "dead-letter[ui,mcp,benchmark]",
  "anyio>=4.0.0",
  "pytest>=9.0.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.15.14",
  "pyright>=1.1.390",
]

[project.urls]
Homepage = "https://github.com/BigCactusLabs/dead-letter"
Repository = "https://github.com/BigCactusLabs/dead-letter"
Issues = "https://github.com/BigCactusLabs/dead-letter/issues"

[project.scripts]
dead-letter = "dead_letter.backend.cli:main"
dead-letter-mcp = "dead_letter.backend.mcp_server:main"
dead-letter-ui = "dead_letter.backend.ui_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dead_letter" = ["frontend/**/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff.lint]
# Keep the lint contract stable across Ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules group imports next to their section dividers by design.
"tests/**" = ["E402"]
