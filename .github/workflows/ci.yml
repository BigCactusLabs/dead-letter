name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --extra dev --locked

      - name: Core tests
        run: uv run pytest -q tests/core

      - name: Backend tests
        run: uv run pytest -q tests/backend

      - name: Plugin tests
        run: uv run pytest -q tests/plugin

      - name: Plugin schema validation
        run: npx --yes @anthropic-ai/claude-code@2.1.145 plugin validate plugin/

      - name: Frontend tests
        run: node --test tests/frontend/*.test.js

      - name: Frontend syntax
        run: node --check src/dead_letter/frontend/static/app.js
