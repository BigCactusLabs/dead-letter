name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev --locked
      - name: Checkout and import provenance
        run: uv run --locked --no-sync python scripts/ci_provenance.py
      - name: Verify core
        run: python scripts/verify.py full --suite core

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev --locked
      - name: Checkout and import provenance
        run: uv run --locked --no-sync python scripts/ci_provenance.py
      - name: Verify backend
        run: python scripts/verify.py full --suite backend
      # Independent of the pytest outcome; generated mail only.
      - name: MBOX full-import audit smoke (synthetic)
        if: success() || failure()
        run: |
          mkdir -p build/mbox-validation
          for mode in direct worker; do
            uv run --locked --no-sync python scripts/benchmark_mbox_import.py --mode "$mode" --messages 8 --attachment-kib 64 --bundles > "build/mbox-validation/$mode.json"
            cat "build/mbox-validation/$mode.json"
          done
          uv run --locked --no-sync python scripts/benchmark_mbox_import.py --compare build/mbox-validation/direct.json build/mbox-validation/worker.json

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev --locked
      - name: Checkout and import provenance
        run: uv run --locked --no-sync python scripts/ci_provenance.py
      - name: Verify plugin
        run: python scripts/verify.py full --suite plugin
        env:
          GH_TOKEN: ${{ github.token }}
      # Plugin adoption may intentionally lag. The canonical metadata helper
      # reports that warning without turning independent versions into an error.
      - name: Plugin pin drift reminder (non-blocking)
        if: always()
        continue-on-error: true
        run: python scripts/release.py check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify frontend
        run: python scripts/verify.py full --suite frontend

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: Build and verify isolated distribution installs
        run: python scripts/verify.py packaging

  # Preserve the old required status name without hiding independent failures.
  test:
    if: always()
    needs: [core, backend, plugin, frontend, packaging]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every independent suite
        env:
          CORE: ${{ needs.core.result }}
          BACKEND: ${{ needs.backend.result }}
          PLUGIN: ${{ needs.plugin.result }}
          FRONTEND: ${{ needs.frontend.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          for result in "$CORE" "$BACKEND" "$PLUGIN" "$FRONTEND" "$PACKAGING"; do
            test "$result" = success || exit 1
          done

  # Local-source bundle checks remain distinct from the installed wheel gate
  # and from a fresh GUI-client installation.
  mcpb:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Checkout and import provenance
        run: uv run --extra dev --locked python scripts/ci_provenance.py
      - name: Provenance contracts
        run: uv run --extra dev --locked python -m unittest discover -s tests/core -p test_ci_provenance.py
      - name: MBOX and streamed-report contracts
        shell: bash
        run: uv run --extra dev --locked pytest -q tests/core/test_mbox*.py tests/core/test_stream_report*.py tests/backend/test_mbox*.py
      - name: Build the MCPB bundle from this checkout
        run: python scripts/build_mcpb.py --local-source . --output-dir build/local-dist
      - name: Smoke test the bundle
        shell: bash
        run: python scripts/smoke_mcpb.py build/local-dist/dead-letter-mcp-*.mcpb
