name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --extra dev --locked

      # Record the synthetic merge commit and this interpreter's source path.
      # Keep this in the test job: a separate workflow proves a different checkout.
      - name: Checkout and import provenance
        run: uv run python scripts/ci_provenance.py

      - name: Core tests
        run: uv run pytest -q tests/core

      - name: Backend tests
        run: uv run pytest -q tests/backend

      # Correctness gate and observational timings, never a noisy speed threshold.
      # Generated mail only: do not add user archives or private validation summaries.
      - name: MBOX full-import audit smoke (synthetic)
        run: |
          mkdir -p build/mbox-validation
          for mode in direct worker; do
            uv run python scripts/benchmark_mbox_import.py --mode "$mode" --messages 8 --attachment-kib 64 --bundles > "build/mbox-validation/$mode.json"
            cat "build/mbox-validation/$mode.json"
          done
          uv run python scripts/benchmark_mbox_import.py --compare build/mbox-validation/direct.json build/mbox-validation/worker.json

      - name: Plugin tests
        run: uv run pytest -q tests/plugin

      - name: Plugin schema validation
        run: npx --yes @anthropic-ai/claude-code@2.1.145 plugin validate plugin/

      # Validates the portable Agent Skill under skills/ against the
      # agentskills.io spec the same way `gh skill publish` would, without
      # publishing anything.
      - name: Agent Skill validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      # Non-blocking reminder: the plugin MCP pin is *allowed* to lag the package
      # version (plugin releases are decoupled by design), so this warns rather
      # than fails. It exists to make a forgotten plugin follow-up release
      # visible instead of silently shipping a stale plugin to the marketplace.
      - name: Plugin pin drift reminder (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          pkg=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          pin=$(python -c "import json, re; a = json.load(open('plugin/.mcp.json'))['mcpServers']['dead-letter']['args']; f = a[a.index('--from') + 1]; print(re.search(r'==([0-9][^\"]*)', f).group(1))")
          if [ "$pkg" != "$pin" ]; then
            echo "::warning title=Plugin pin lags package::plugin/.mcp.json pins dead-letter[mcp]==$pin but pyproject.toml is $pkg. If this package release should reach plugin/Cowork users, cut a plugin follow-up release (docs/reference/publishing.md)."
          else
            echo "Plugin pin ($pin) matches package version ($pkg)."
          fi

      - name: Frontend tests
        run: node --test tests/frontend/*.test.js

      - name: Frontend syntax
        run: node --check src/dead_letter/frontend/static/app.js

  # Builds the MCPB bundle from this checkout (not PyPI) and launches it the
  # way an MCPB host would: unpack, `uv run` the entry point, MCP handshake,
  # tools/list, and one fixture conversion. Runs on the three platforms Claude
  # Desktop's uv runtime targets. The release workflow repeats the same smoke
  # against the real PyPI pin before attaching the asset.
  mcpb:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Checkout and import provenance
        run: uv run --extra dev --locked python scripts/ci_provenance.py

      - name: Provenance contracts
        run: uv run --extra dev --locked python -m unittest discover -s tests/core -p test_ci_provenance.py

      - name: MBOX and streamed-report contracts
        shell: bash
        run: uv run --extra dev --locked pytest -q tests/core/test_mbox*.py tests/core/test_stream_report*.py tests/backend/test_mbox*.py

      - name: Build the MCPB bundle from this checkout
        run: python scripts/build_mcpb.py --local-source . --output-dir build/local-dist

      - name: Smoke test the bundle
        shell: bash
        run: python scripts/smoke_mcpb.py build/local-dist/dead-letter-mcp-*.mcpb
