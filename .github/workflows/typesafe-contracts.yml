name: typesafe-contracts

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  sdk-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Sync development and exact optional SDK dependencies from lock
        run: uv sync --extra dev --extra typesafe --locked
      - name: Require the tested SDK (do not silently skip the suite)
        run: uv run --locked --no-sync python -c "import typesafe_sdk, httpx2; from importlib.metadata import version; assert version('typesafe-sdk') == '0.7.0'"
      - name: SDK and EML contract tests with fake HTTP only
        run: uv run --locked --no-sync pytest -q tests/backend/test_typesafe_provider.py tests/backend/test_analysis_contracts.py tests/backend/test_analysis_eml.py
