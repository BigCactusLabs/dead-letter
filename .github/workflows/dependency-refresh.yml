name: dependency-refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Starts the checks below on the refresh branch; see the last step.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Refresh lockfile
        run: uv lock --upgrade

      - name: Sync workspace
        run: uv sync --extra dev

      - name: Core tests
        run: uv run pytest -q tests/core

      - name: Backend tests
        run: uv run pytest -q tests/backend

      - name: Frontend tests
        run: node --test tests/frontend/*.test.js

      - name: Frontend syntax
        run: node --check src/dead_letter/frontend/static/app.js

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: chore/dependency-refresh
          commit-message: "chore(deps): refresh uv lock"
          title: "chore(deps): refresh uv lock"
          body: |
            Weekly transitive dependency refresh generated by the scheduled workflow.

            This PR was opened with the default `GITHUB_TOKEN`, so its `pull_request`
            workflows wait for a maintainer's approval and the check summary below starts empty.
            The refresh workflow has already dispatched `ci`, `typesafe-contracts`,
            `release-check` and `client-installs` on this branch. Their results are on the
            head commit and in the Actions tab (filter by branch `chore/dependency-refresh`);
            they are not counted in this PR's check summary.
            To fill the summary and also run `workflow-lint` and `docs-link-check`, approve
            the waiting workflow runs on this PR.
          add-paths: |
            uv.lock

      # workflow_dispatch is one of the two events the default GITHUB_TOKEN may
      # trigger, so these runs start without the approval the PR's own runs need.
      # Observed on #292 (2026-11-10): results attach to the head commit but the
      # PR's check summary does not list them.
      - name: Start checks on the refresh branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in ci.yml typesafe-contracts.yml release-check.yml client-installs.yml; do
            gh workflow run "$workflow" --ref chore/dependency-refresh
          done
