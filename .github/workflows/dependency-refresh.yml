name: dependency-refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Refresh lockfile
        run: uv lock --upgrade

      - name: Sync workspace
        run: uv sync --extra dev

      - name: Core tests
        run: uv run pytest -q tests/core

      - name: Backend tests
        run: uv run pytest -q tests/backend

      - name: Frontend tests
        run: node --test tests/frontend/*.test.js

      - name: Frontend syntax
        run: node --check src/dead_letter/frontend/static/app.js

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          branch: chore/dependency-refresh
          commit-message: "chore(deps): refresh uv lock"
          title: "chore(deps): refresh uv lock"
          # A PR opened with the default GITHUB_TOKEN starts no pull_request
          # workflows, so CI must be started by a maintainer event.
          body: |
            Weekly transitive dependency refresh generated by the scheduled workflow.

            This PR was opened with the default `GITHUB_TOKEN`, so no CI checks start on their own.
            Before merging, a maintainer starts them by pushing to this branch
            (for example, merging `main` into it) or by closing and reopening the PR.
          add-paths: |
            uv.lock
