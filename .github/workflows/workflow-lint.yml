name: workflow-lint

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: Install verified actionlint
        id: actionlint
        # Upstream release asset 384924896; update version and checksum together.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          test "$(uname -m)" = x86_64
          tools="$RUNNER_TEMP/workflow-tools"
          mkdir -p "$tools"
          curl --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$tools/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $tools/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/actionlint" -version
          # actionlint silently skips embedded shell checking without ShellCheck.
          command -v shellcheck
          shellcheck --version
      - name: Validate workflow syntax and embedded shell
        if: (success() || failure()) && steps.actionlint.outcome == 'success'
        run: actionlint -color
      - name: Audit workflow security (regular)
        # Run even when actionlint fails, so neither tool masks the other.
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv tool run --from zizmor==1.30.1 zizmor --no-progress --persona=regular .github/workflows
