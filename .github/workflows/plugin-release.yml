name: plugin release

on:
  push:
    tags:
      - "plugin-v*"

# One pointer update at a time. GitHub does not guarantee queued-run order;
# ancestry checks also reject stale tags before the marketplace can change.
concurrency:
  group: dead-letter-plugin-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  advance-release:
    if: github.repository == 'BigCactusLabs/dead-letter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify release token is configured
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is required. See docs/reference/publishing.md -> Plugin Release for repository and permission scopes." >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate plugin tag and target before any pointer update
        id: release
        run: |
          python scripts/release.py check --plugin-tag "$GITHUB_REF_NAME"
          sha=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$sha"
          git merge-base --is-ancestor "$sha" origin/main
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            git merge-base --is-ancestor origin/release "$sha" || {
              echo '::error::Tagged commit would move release backwards. Marketplace remains unchanged.' >&2
              exit 1
            }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from release import check, read_sources
          versions = check(read_sources(Path(".")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mcp_version={versions['plugin_pin']}\nplugin_version={versions['plugin']}\n")
          PY
      - name: Wait for both PyPI indexes to serve the pinned package
        env:
          MCP_VERSION: ${{ steps.release.outputs.mcp_version }}
        run: python scripts/release.py wait-pypi "$MCP_VERSION"
      - name: Checkout marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BigCactusLabs/bigcactuslabs-plugins
          ref: main
          path: marketplace
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: false
      - name: Publish plugin pointer through the marketplace
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          MARKETPLACE_REPO: BigCactusLabs/bigcactuslabs-plugins
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
          PLUGIN_REF: ${{ github.ref_name }}
          PLUGIN_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("marketplace/.claude-plugin/marketplace.json")
          data = json.loads(path.read_text())
          plugin = next(item for item in data["plugins"] if item["name"] == "dead-letter")
          plugin["version"] = os.environ["PLUGIN_VERSION"]
          plugin["source"]["ref"] = os.environ["PLUGIN_REF"]
          plugin["source"]["sha"] = os.environ["PLUGIN_SHA"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          cd marketplace
          if git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "Marketplace already points at dead-letter ${PLUGIN_VERSION}."
            exit 0
          fi
          branch="release/dead-letter-${PLUGIN_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .claude-plugin/marketplace.json
          git commit -m "chore: publish dead-letter ${PLUGIN_VERSION}"
          # Use the step token without storing credentials in either checkout.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/${branch}"
          pr_url=$(gh pr create \
            --repo "$MARKETPLACE_REPO" --base main --head "$branch" \
            --title "chore: publish dead-letter ${PLUGIN_VERSION}" \
            --body "Pins dead-letter ${PLUGIN_VERSION} to ${PLUGIN_REF} at ${PLUGIN_SHA}. Generated by the dead-letter plugin release workflow.")
          gh pr merge --repo "$MARKETPLACE_REPO" "$pr_url" --squash --delete-branch
      - name: Fast-forward release to the tagged commit
        env:
          # Compatibility pushes can carry workflow changes: Workflows:write
          # is needed here, not during source validation or dependency setup.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PLUGIN_SHA: ${{ steps.release.outputs.sha }}
        # No force: a concurrent manual branch update must not be overwritten.
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "$PLUGIN_SHA:refs/heads/release"
      - name: Summarize release advance
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
          MCP_VERSION: ${{ steps.release.outputs.mcp_version }}
          PLUGIN_SHA: ${{ steps.release.outputs.sha }}
        run: |
          printf 'Published plugin %s at %s; exact PyPI MCP pin %s was available on both indexes. Marketplace pointer updated and compatibility release branch fast-forwarded.\n' "$PLUGIN_VERSION" "$PLUGIN_SHA" "$MCP_VERSION" >> "$GITHUB_STEP_SUMMARY"
