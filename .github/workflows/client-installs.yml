name: client-installs

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  published-launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check generated metadata without modifying client settings
        run: python scripts/generate_client_installs.py --check
      # Reuse downloaded files so repeated runs do not inflate the package's
      # public PyPI download count. The smoke deletes cached tool environments
      # and index pages before launching, so the unpinned command resolves
      # against the live index on every run. No restore-keys: each release
      # (server.json change) starts from an empty cache, so every version gets
      # one cold install per OS.
      - name: Restore uv cache for the public launcher
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/client-smoke-uv-cache
          key: client-smoke-uv-${{ runner.os }}-${{ hashFiles('server.json') }}
      - name: Launch public PyPI package and convert synthetic mail
        env:
          DEAD_LETTER_SMOKE_UV_CACHE_DIR: ${{ runner.temp }}/client-smoke-uv-cache
        run: python scripts/smoke_client_install.py

  cline-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cline/marketplace
          # Pinned validator/schema, not arbitrary future upstream code.
          ref: e59b03e4f8904073b43b40e93d975f639d1fa694
          path: build/cline-marketplace
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Stage the candidate without replacing an upstream entry
        run: |
          target=build/cline-marketplace/registry/mcps/dead-letter
          test ! -e "$target"
          mkdir -p "$target"
          cp docs/project/submissions/cline/entry.json "$target/entry.json"
      # The pinned generator uses Node built-ins only; no npm install needed.
      - name: Run Cline's actual marketplace validator
        working-directory: build/cline-marketplace
        run: npm run validate

  cline-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Restore uv cache for the registered launcher
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cline-smoke-uv-cache
          key: cline-smoke-uv-${{ runner.os }}-${{ hashFiles('server.json') }}
      - name: Register the candidate in a disposable Cline CLI profile
        env:
          DEAD_LETTER_SMOKE_UV_CACHE_DIR: ${{ runner.temp }}/cline-smoke-uv-cache
        # Script pins @cline/cli, removes inherited credentials, and never asks
        # an agent/model to run. --yes affects only this synthetic profile.
        run: python scripts/smoke_cline_registration.py

  discovery-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Record public catalog evidence without submissions or credentials
        # Missing/unknown entries are reported, not conversion test failures.
        # Offline tests cover the classifier; there is no scheduled crawler.
        run: python scripts/audit_mcp_discovery.py --output build/discovery-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/discovery-evidence.json
          retention-days: 30
          if-no-files-found: error
