name: docs-link-check

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory maintained Markdown
        run: |
          # Tracked docs only: exclude synthetic mail/output fixtures and caches.
          git ls-files '*.md' | python3 -c '
          import sys
          roots = {"docs", "plugin", "skills", "mcpb", "docker", ".github"}
          files = [line.rstrip("\n") for line in sys.stdin]
          docs = [p for p in files if "/" not in p or p.split("/")[0] in roots or p == "benchmarks/README.md"]
          if not docs:
              raise SystemExit("No maintained documentation found")
          print("\n".join(docs))
          ' > "$RUNNER_TEMP/docs-files.txt"
          cat "$RUNNER_TEMP/docs-files.txt"
      - name: Verify the live VS Code install redirect and command payload
        run: python3 scripts/check_install_redirect.py
      - name: Check markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          # The excluded HTTPS wrapper is checked above, including its exact
          # custom-protocol Location. Do not accept all redirects or 429s.
          # The exact Cursor Directory submission form repeatedly returns 429
          # from Actions; manually verified on 2026-09-18, tracked in #104.
          # Its owner-facing form remains a manual acceptance check.
          args: >-
            --no-progress
            --verbose
            --max-retries 4
            --retry-wait-time 5
            --root-dir .
            --exclude '^http://127\.0\.0\.1'
            --exclude '^http://localhost'
            --exclude '^https://vscode\.dev/redirect\?url=vscode%3Amcp%2Finstall%3F'
            --exclude '^https://cursor\.directory/plugins/new$'
            --files-from '${{ runner.temp }}/docs-files.txt'
          fail: true
          failIfEmpty: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
